<!doctype html><html><head><meta charset="utf-8">

<style>

</style></head><body><div class="wrap">

  </defs>
  <g transform="rotate(-7 512 512)" filter="url(#ink)" fill="none" stroke="#2B3CC4">
    <circle cx="512" cy="512" r="388" stroke-width="30"/>
    <circle cx="512" cy="512" r="330" stroke-width="8"/>
    <text font-family="JetBrains Mono" font-weight="500" font-size="44" letter-spacing="6" fill="#2B3CC4" stroke="none">
      <textPath href="#ring" startOffset="0" textLength="1860" lengthAdjust="spacing">SQUADJAR · SAVE TOGETHER · NOBODY HOLDS THE JAR ·</textPath>
    </text>
    <text x="506" y="626" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="380" letter-spacing="-18" fill="#2B3CC4" stroke="none">sj</text>
