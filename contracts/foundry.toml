[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 60
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
